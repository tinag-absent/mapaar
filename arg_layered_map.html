
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>観測端末 地図システム</title>
<style>
body {
  margin:0;
  background:#020617;
  color:#e2e8f0;
  font-family:sans-serif;
}
#map {
  width:100vw;
  height:100vh;
}
.muni {
  fill:#1e293b;
  stroke:#475569;
  stroke-width:0.6;
  cursor:pointer;
}
.muni:hover {
  fill:#3b82f6;
}
.road {
  stroke:#94a3b8;
  stroke-width:0.8;
  fill:none;
  opacity:0.7;
}
.river {
  stroke:#38bdf8;
  stroke-width:1.2;
  fill:none;
  opacity:0.8;
}
.marker {
  fill:#f43f5e;
  stroke:white;
  stroke-width:1;
}
</style>
</head>
<body>

<svg id="map" viewBox="0 0 800 1000"></svg>

<script>
const svg = document.getElementById("map");

function project([x,y], bounds){
  const [minx,miny,maxx,maxy] = bounds;
  const px = (x-minx)/(maxx-minx)*800;
  const py = 1000-(y-miny)/(maxy-miny)*1000;
  return [px,py];
}

function drawGeoJSON(data, cls, bounds){
  data.features.forEach(f=>{
    if(!f.geometry) return;
    if(f.geometry.type==="LineString"){
      const coords = f.geometry.coordinates
        .map(c=>project(c,bounds))
        .map((p,i)=>(i?"L":"M")+p[0]+","+p[1])
        .join(" ");
      const path=document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d",coords);
      path.setAttribute("class",cls);
      svg.appendChild(path);
    }
  });
}

function drawMunicipalities(data,bounds){
  data.features.forEach(f=>{
    if(!f.geometry) return;
    const name=f.properties?.N03_004||"unknown";
    const coords=f.geometry.coordinates[0]
      .map(c=>project(c,bounds))
      .map((p,i)=>(i?"L":"M")+p[0]+","+p[1])
      .join(" ")+" Z";

    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",coords);
    path.setAttribute("class","muni");
    path.dataset.name=name;

    path.onclick=()=>{
      alert(name+" 観測データを表示");
    };

    svg.appendChild(path);
  });
}

function drawMarkers(points,bounds){
  points.features.forEach(f=>{
    const [px,py]=project(f.geometry.coordinates,bounds);
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",px);
    c.setAttribute("cy",py);
    c.setAttribute("r",4);
    c.setAttribute("class","marker");
    svg.appendChild(c);
  });
}

Promise.all([
  fetch("municipalities.geojson").then(r=>r.json()),
  fetch("roads.geojson").then(r=>r.json()),
  fetch("rivers.geojson").then(r=>r.json()),
  fetch("points.geojson").then(r=>r.json())
]).then(([muni,roads,rivers,points])=>{

  let minx=999,miny=999,maxx=-999,maxy=-999;
  muni.features.forEach(f=>{
    f.geometry.coordinates[0].forEach(([x,y])=>{
      minx=Math.min(minx,x);
      miny=Math.min(miny,y);
      maxx=Math.max(maxx,x);
      maxy=Math.max(maxy,y);
    });
  });
  const bounds=[minx,miny,maxx,maxy];

  drawMunicipalities(muni,bounds);
  drawGeoJSON(roads,"road",bounds);
  drawGeoJSON(rivers,"river",bounds);
  drawMarkers(points,bounds);

});
</script>

</body>
</html>
