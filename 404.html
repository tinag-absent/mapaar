<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>404 - ページが見つかりません | 海蝕機関</title>
  <link rel="icon" type="image/png" href="./images/favicon.png">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .error-content {
      max-width: 800px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .error-code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      line-height: 1;
      color: var(--primary);
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      margin-bottom: 1rem;
      position: relative;
      display: inline-block;
    }

    .error-code::before {
      content: '404';
      position: absolute;
      top: 0;
      left: 0;
      color: rgba(239, 68, 68, 0.3);
      z-index: -1;
      animation: glitch 3s infinite;
    }

    @keyframes glitch {
      0%, 100% {
        transform: translate(0, 0);
      }
      10% {
        transform: translate(-2px, 2px);
      }
      20% {
        transform: translate(2px, -2px);
      }
      30% {
        transform: translate(-2px, -2px);
      }
      40% {
        transform: translate(2px, 2px);
      }
      50% {
        transform: translate(0, 0);
      }
    }

    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      color: var(--foreground);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .error-message {
      font-size: 1.125rem;
      color: var(--muted-foreground);
      margin-bottom: 3rem;
      line-height: 1.8;
      font-family: 'JetBrains Mono', monospace;
    }

    .error-details {
      background: linear-gradient(135deg, rgba(26, 39, 56, 0.4), rgba(15, 23, 42, 0.4));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid var(--destructive);
      padding: 1.5rem;
      margin-bottom: 3rem;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }

    .error-details-title {
      color: var(--destructive);
      font-weight: 600;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.875rem 2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      font-weight: 500;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 0.05em;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--primary);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: var(--foreground);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    }

    .background-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.3;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(50px, 50px);
      }
    }

    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 255, 255, 0.05) 50%,
        transparent 100%
      );
      background-size: 100% 4px;
      animation: scan 8s linear infinite;
      pointer-events: none;
      opacity: 0.3;
    }

    @keyframes scan {
      0% {
        background-position: 0 0;
      }
      100% {
        background-position: 0 100vh;
      }
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 3rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted-foreground);
      text-transform: uppercase;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      background: var(--destructive);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 10px var(--destructive);
      }
      50% {
        opacity: 0.5;
        box-shadow: 0 0 5px var(--destructive);
      }
    }

    @media (max-width: 768px) {
      .error-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="background-grid"></div>
    <div class="scanline"></div>

    <div class="error-content">
      <div class="error-code">404</div>
      
      <h1 class="error-title">
        次元座標エラー
      </h1>

      <p class="error-message">
        指定されたページは存在しないか、<br>
        次元の歪みにより消失した可能性があります。
      </p>

      <div class="error-details">
        <div class="error-details-title">
          ⚠ システムメッセージ
        </div>
        <div>
          ERROR_CODE: DIMENSION_NOT_FOUND<br>
          STATUS: リソースが次元境界上に存在しません<br>
          RECOMMENDATION: 既知の座標への移動を推奨します
        </div>
      </div>

      <div class="error-actions">
        <a href="./dashboard.html" class="btn btn-primary">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          ダッシュボードへ
        </a>
        <a href="./index.html" class="btn btn-secondary">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          トップページへ
        </a>
      </div>

      <div class="status-bar">
        <div class="status-indicator"></div>
        <span>SYSTEM STATUS: ACTIVE</span>
        <span>|</span>
        <span>DIMENSION: PRIMARY</span>
      </div>
    </div>
  </div>

  <script>
    // Add glitch effect on random intervals
    function addGlitchEffect() {
      const errorCode = document.querySelector('.error-code');
      errorCode.style.animation = 'none';
      setTimeout(() => {
        errorCode.style.animation = '';
      }, 10);
    }

    setInterval(() => {
      if (Math.random() > 0.7) {
        addGlitchEffect();
      }
    }, 3000);

    // Add random text corruption effect
    const originalText = '次元座標エラー';
    const glitchChars = '次元座標エラー海蝕機関収束装置';
    const titleElement = document.querySelector('.error-title');

    function corruptText() {
      let corrupted = '';
      for (let i = 0; i < originalText.length; i++) {
        if (Math.random() > 0.9) {
          corrupted += glitchChars[Math.floor(Math.random() * glitchChars.length)];
        } else {
          corrupted += originalText[i];
        }
      }
      titleElement.textContent = corrupted;
      
      setTimeout(() => {
        titleElement.textContent = originalText;
      }, 100);
    }

    setInterval(() => {
      if (Math.random() > 0.95) {
        corruptText();
      }
    }, 2000);
  </script>
</body>
</html>
